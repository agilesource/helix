name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, v1.x]
  pull_request:
    branches: [main, v1.x]

jobs:
  skills-validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Count skills
        id: skills
        run: |
          count=$(find skills/ -name "SKILL.md" 2>/dev/null | wc -l)
          echo "Found $count skills"
          echo "count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -lt 30 ]; then
            echo "⚠️ Expected at least 30 skills, found $count"
            exit 1
          fi
          echo "✅ Found $count skills"
      
      - name: Validate SKILL.md format
        run: |
          # Check frontmatter exists
          invalid=0
          for f in $(find skills/ -name "SKILL.md" 2>/dev/null); do
            if ! head -3 "$f" 2>/dev/null | grep -q "^---"; then
              echo "⚠️ $f missing frontmatter"
              invalid=$((invalid + 1))
            fi
          done
          if [ "$invalid" -gt 0 ]; then
            echo "❌ Found $invalid files without valid frontmatter"
            exit 1
          fi
          echo "✅ All SKILL.md files have valid frontmatter"
      
      - name: Check category structure
        run: |
          categories=$(find skills/ -maxdepth 1 -type d 2>/dev/null | tail -n +2 | wc -l)
          echo "Found $categories skill categories"
          if [ "$categories" -lt 6 ]; then
            echo "⚠️ Expected at least 6 categories"
            exit 1
          fi
          echo "✅ Category structure valid"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install markdownlint-cli2 yamllint 2>/dev/null || true
      
      - name: Run markdownlint
        run: |
          markdownlint "skills/**/*.md" "docs/**/*.md" "README.md" "CHANGELOG.md" --ignore node_modules 2>/dev/null || echo "Lint warnings found (non-blocking)"
        continue-on-error: true
      
      - name: Run yamllint
        run: |
          yamllint .github/ 2>/dev/null || echo "YAML warnings found (non-blocking)"
        continue-on-error: true

  docs-validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          echo "✅ README.md exists"
      
      - name: Check CHANGELOG exists
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "⚠️ CHANGELOG.md not found"
          else
            echo "✅ CHANGELOG.md exists"
          fi
      
      - name: Verify version consistency
        run: |
          if [ -f "VERSION" ]; then
            ver=$(cat VERSION 2>/dev/null)
            echo "VERSION: $ver"
          fi
          if grep -q "v[0-9]" README.md 2>/dev/null; then
            echo "✅ Version found in README"
          fi

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [skills-validate, lint, docs-validate]
    steps:
      - uses: actions/checkout@v4
      
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          skills=$(find skills/ -name "SKILL.md" 2>/dev/null | wc -l)
          categories=$(find skills/ -maxdepth 1 -type d 2>/dev/null | tail -n +2 | wc -l)
          
          echo "### Skills Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Total Skills: $skills" >> $GITHUB_STEP_SUMMARY
          echo "- Categories: $categories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Categories" >> $GITHUB_STEP_SUMMARY
          for cat in skills/*/; do
            if [ -d "$cat" ]; then
              name=$(basename "$cat")
              count=$(find "$cat" -name "SKILL.md" 2>/dev/null | wc -l)
              echo "- $name: $count skills" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ CI Validation Complete" >> $GITHUB_STEP_SUMMARY
