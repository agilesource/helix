name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate release notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "## What's New in v$TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count skills
          skills=$(find skills/ -name "SKILL.md" 2>/dev/null | wc -l)
          echo "### Skills" >> $GITHUB_STEP_SUMMARY
          echo "- Total: $skills skills" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List categories
          echo "### Categories" >> $GITHUB_STEP_SUMMARY
          for cat in skills/*/; do
            name=$(basename "$cat")
            count=$(find "$cat" -name "SKILL.md" | wc -l)
            echo "- $name: $count skills" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Contributors" >> $GITHUB_STEP_SUMMARY
          echo "Thanks to all contributors!" >> $GITHUB_STEP_SUMMARY
