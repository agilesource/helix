# Project Helix - Docker Compose
# Development and production orchestration

services:
  # Helix API Service
  helix-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: helix:1.0.0-beta.3
    container_name: helix-api
    ports:
      - "${HELIX_PORT:-8000}:8000"
    environment:
      - HELIX_ENV=production
      - HELIX_PORT=8000
      - HELIX_LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - helix-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - helix-network

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: helix-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - helix-network
    command: redis-server --appendonly yes

  # Helix Development Environment
  helix-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: helix:1.0.0-beta.3-dev
    container_name: helix-dev
    environment:
      - HELIX_ENV=development
      - HELIX_PORT=8000
      - HELIX_LOG_LEVEL=debug
    volumes:
      - .:/app
      - helix-dev-data:/app/data
    ports:
      - "${HELIX_DEV_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - helix-network
    profiles:
      - dev

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: helix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - helix-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: helix-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - helix-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

networks:
  helix-network:
    driver: bridge

volumes:
  helix-data:
  helix-dev-data:
  redis-data:
  prometheus-data:
  grafana-data:
